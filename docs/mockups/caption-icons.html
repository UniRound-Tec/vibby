<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>caption icons</title>
<style>
    body { margin: 0; padding: 20px 0; background: #18141d; color: #9a90a7; font: 12px/1.5 system-ui, sans-serif; }
    .row { display: flex; align-items: center; margin: 14px 24px; }
    .label { width: 150px; flex: none; color: #6f6879; }
    .label b { display: block; color: #cfc9d6; font-size: 13px; }
    .cap { width: 46px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; }
    .cap svg { width: 16px; height: 16px; display: block; }
    .cap.close-sim { background: #e81123; color: #fff; }
    .sep { width: 24px; flex: none; }
    .title-sim { display: flex; align-items: center; color: #cfc9d6; font-size: 14px; margin-right: auto; }
    .title-sim span { padding-left: 15px; }
</style>
</head>
